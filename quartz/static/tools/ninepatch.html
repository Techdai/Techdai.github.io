<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点九预览</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f5f7,#17181b);--panel:light-dark(#fff,#222429);--ink:light-dark(#202128,#f2f3f6);--muted:light-dark(#6c6f78,#a9adb7);--line:light-dark(#dedfe5,#393c44);--accent:light-dark(#4856cf,#a5adff);--tile:light-dark(#e5e6ea,#34363c)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1200px;margin:auto;padding:36px 28px}header{display:flex;align-items:baseline;gap:16px;margin-bottom:24px}h1{font-size:25px;letter-spacing:-.5px;margin:0}p{margin:0;color:var(--muted)}button,input,select,textarea{font:inherit}button,select,input[type=number]{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input[type=range],input[type=checkbox]{accent-color:var(--accent)}button.primary{background:var(--accent);color:light-dark(#fff,#17182b);border-color:transparent}.drop{border:1.5px dashed var(--line);border-radius:16px;background:var(--panel);text-align:center;padding:28px 20px;transition:border-color .15s}.drop.over{border-color:var(--accent);background:var(--bg)}.drop strong{display:block;font-size:17px;font-weight:600;margin-bottom:6px}.drop button{margin-top:15px}.drop small{display:block;color:var(--muted);margin-top:12px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;margin-top:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.status{color:var(--accent);font-weight:600;margin:10px 0;overflow-wrap:anywhere}.status.bad{color:light-dark(#b13a26,#ffb295)}#filename{font-weight:600;overflow-wrap:anywhere}#facts{color:var(--muted);white-space:pre-line;font-size:13px}.field{margin-top:22px}.field label{display:block;margin-bottom:8px}.field .row{flex-wrap:nowrap}input[type=range]{width:100%;min-width:30px}input[type=number]{width:78px}h2{font-size:14px;font-weight:600;margin:0 0 12px}.small{color:var(--muted);font-size:12px}.toggles{display:grid;gap:10px;margin-top:24px}.toggles label{display:flex;align-items:center;gap:7px}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.preview-head h2{margin:0}.stage{min-height:300px;max-height:620px;overflow:auto;display:grid;place-items:center;padding:32px;background-color:var(--panel);border-radius:10px;background-image:conic-gradient(var(--tile) 25%,transparent 0 50%,var(--tile) 0 75%,transparent 0);background-size:16px 16px}.stage.dark{background:#26272b;background-image:none}.stage.light{background:#fff;background-image:none}.stage canvas{display:block}#empty{text-align:center;color:var(--muted)}.original{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.original canvas{max-width:100%;height:auto;background:var(--bg);image-rendering:pixelated}.details{margin-top:20px}.details summary{cursor:pointer;color:var(--muted)}#data{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:12px}.content-example{margin-top:14px}.content-example textarea{display:block;min-height:120px;resize:vertical;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}#notice{margin-top:12px;min-height:20px;color:var(--muted);font-size:12px}footer{margin-top:18px;color:var(--muted);font-size:12px}[hidden]{display:none!important}fieldset{margin:0;padding:0;border:0;min-width:0}@media(max-width:720px){main{padding:22px 14px}header{display:block}header p{margin-top:4px}.layout{grid-template-columns:1fr}.stage{min-height:240px;padding:20px}.panel{padding:16px}}
</style>
<main>
 <header><h1>点九预览</h1><p>拖一张图片，看看边角和拉伸是否正确</p></header>
 <section class="drop" id="drop" aria-label="拖入 PNG 图片">
  <strong>把 .9.png 或编译后的 .png 拖到这里</strong>
  <p>读取源图标线或内置九宫格数据，实时预览拉伸效果</p>
  <button type="button" class="primary" id="choose">选择图片</button><input type="file" id="file" accept="image/png,.png" hidden>
  <small>本地读取 · 无需安装 · 图片不会上传</small>
 </section>
 <div class="layout">
  <aside class="panel">
   <div id="filename">尚未选择图片</div><div id="status" class="status" role="status" aria-live="polite">等待图片</div><div id="facts"></div>
   <fieldset id="controls" disabled>
    <div class="field"><label for="width">预览宽度 · px</label><div class="row"><input id="width" type="range" min="1" max="1600" value="300"><input id="wn" type="number" min="1" max="4096" value="300" aria-label="预览宽度数值"></div></div>
    <div class="field"><label for="height">预览高度 · px</label><div class="row"><input id="height" type="range" min="1" max="1000" value="120"><input id="hn" type="number" min="1" max="4096" value="120" aria-label="预览高度数值"></div></div>
    <div class="row" style="margin-top:16px"><button id="natural" type="button">原始尺寸</button><button id="wide" type="button">横向拉伸</button></div>
    <div class="toggles"><label><input type="checkbox" id="regions">显示拉伸区域</label><label><input type="checkbox" id="padding">显示内容边距</label></div>
    <div class="content-example"><textarea id="text" rows="5" placeholder="输入文字，按内容区域自动换行；超出部分显示…" aria-label="预览文字"></textarea></div>
   </fieldset>
   <details class="details"><summary>查看九宫格数据</summary><pre id="data">尚未载入</pre></details>
  </aside>
  <section class="panel">
   <div class="preview-head"><h2>拉伸预览 <span class="small" id="size"></span></h2><div class="row"><select id="background" aria-label="预览背景"><option value="grid">透明棋盘</option><option value="dark">深色背景</option><option value="light">浅色背景</option></select><select id="zoom" aria-label="显示倍率"><option value="1">100%</option><option value="2">200%</option><option value="3">300%</option></select></div></div>
   <div class="stage" id="stage"><div id="empty">选择图片后，在这里预览</div><canvas id="preview" hidden aria-label="图片拉伸预览"></canvas></div>
   <div id="notice" role="status"></div>
   <div class="original" id="originalWrap" hidden><h2>原图与拉伸标记 <span class="small">蓝色：横向 · 绿色：纵向</span></h2><canvas id="original" aria-label="原图及拉伸标线"></canvas></div>
  </section>
 </div>
 <footer>以 PNG 像素为单位预览，不模拟 Android 屏幕密度。仅用于查看，不会修改图片。</footer>
</main>
<script>
'use strict';
// CORE_START
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^0xffffffff)>>>0;}
function parsePNG(buffer){
 const bytes=new Uint8Array(buffer),v=new DataView(buffer),signature=[137,80,78,71,13,10,26,10];
 if(bytes.length<33||!signature.every((n,i)=>bytes[i]===n))throw Error('请选择有效的 PNG 文件。');
 let pos=8,patch=null,end=false;const chunks=[];
 while(pos+12<=bytes.length){const n=v.getUint32(pos),stop=pos+12+n;if(stop>bytes.length)throw Error('PNG 数据不完整。');const kind=String.fromCharCode(...bytes.subarray(pos+4,pos+8));
  if(crc32(bytes.subarray(pos+4,pos+8+n))!==v.getUint32(pos+8+n))throw Error('PNG 数据校验失败：'+kind);
  chunks.push(kind);if(kind==='npTc')patch=bytes.slice(pos+8,pos+8+n);pos=stop;if(kind==='IEND'){end=true;break;}}
 if(!end||chunks[0]!=='IHDR')throw Error('PNG 数据不完整。');
 return{width:v.getUint32(16),height:v.getUint32(20),patch,chunks};
}
function checkDivs(divs,size){return divs.length>=2&&divs.length%2===0&&divs.every((x,i)=>Number.isInteger(x)&&x>=0&&x<=size&&(i===0||x>divs[i-1]));}
function parsePatch(bytes,width,height){
 if(bytes.length<32)throw Error('九宫格数据不完整。');const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),nx=bytes[1],ny=bytes[2],nc=bytes[3];
 if(bytes.length!==32+4*(nx+ny+nc))throw Error('九宫格数据长度不正确。');
 const read=(at,n)=>Array.from({length:n},(_,i)=>v.getInt32(at+i*4));const x=read(32,nx),y=read(32+nx*4,ny),p=read(12,4);
 if(!checkDivs(x,width)||!checkDivs(y,height))throw Error('九宫格拉伸坐标不合法。');
 if(p.some(n=>n<0)||p[0]+p[1]>width||p[2]+p[3]>height)throw Error('九宫格内容边距不合法。');
 return{x,y,padding:p};
}
function sourcePatch(rgba,width,height){
 if(width<3||height<3)throw Error('点九源图至少需要 3×3 像素。');
 const black=(x,y)=>{const i=(y*width+x)*4;return rgba[i]===0&&rgba[i+1]===0&&rgba[i+2]===0&&rgba[i+3]===255;};
 const clear=(x,y)=>{const i=(y*width+x)*4;return rgba[i+3]===0||(rgba[i]===255&&rgba[i+1]===255&&rgba[i+2]===255&&rgba[i+3]===255);};
 for(let x=0;x<width;x++)for(const y of[0,height-1])if(!black(x,y)&&!clear(x,y))throw Error('源图边缘有非黑色标线，请检查 1px 标记边。');
 for(let y=0;y<height;y++)for(const x of[0,width-1])if(!black(x,y)&&!clear(x,y))throw Error('源图边缘有非黑色标线，请检查 1px 标记边。');
 for(const x of[0,width-1])for(const y of[0,height-1])if(black(x,y))throw Error('源图四角不能是黑色标记。');
 const runs=(length,hit)=>{const a=[];let on=false;for(let i=0;i<length;i++){const next=hit(i);if(next!==on){a.push(i);on=next;}}if(on)a.push(length);return a;};
 const w=width-2,h=height-2,x=runs(w,i=>black(i+1,0)),y=runs(h,i=>black(0,i+1));
 if(!checkDivs(x,w)||!checkDivs(y,h))throw Error('未找到完整拉伸标线：源图顶部和左侧都需要纯黑色标线。');
 const px=runs(w,i=>black(i+1,height-1)),py=runs(h,i=>black(width-1,i+1));
 if(px.length>2||py.length>2)throw Error('源图底部和右侧的内容标线应为单一连续区域。');
 return{x,y,padding:[px.length?px[0]:x[0],px.length?w-px[1]:w-x[x.length-1],py.length?py[0]:y[0],py.length?h-py[1]:h-y[y.length-1]]};
}
function segments(size,divs,target){
 const points=[0,...divs,size],flex=divs.reduce((n,v,i)=>n+(i%2?v:-v),0),fixed=size-flex;
 let dest=0;return points.slice(0,-1).map((s,i)=>{const length=points[i+1]-s,stretch=i%2===1;
 const delta=target>=fixed?(stretch?length*(target-fixed)/flex:length):(stretch?0:length*target/fixed);
 const start=Math.round(dest);dest+=delta;return{s,length,d:start,n:Math.round(dest)-start,stretch};});
}
function layoutText(text,width,height,measure,lineHeight=18){
 const maxLines=Math.floor(height/lineHeight);
 if(!text||width<=0||maxLines<=0)return[];
 const lines=[];
 for(const paragraph of text.replace(/\r\n?/g,'\n').split('\n')){
  let line='';
  for(const char of paragraph){
   if(line&&measure(line+char)>width){lines.push(line);line=char;}else line+=char;
  }
  lines.push(line);
 }
 const visible=lines.slice(0,maxLines);
 if(lines.length>maxLines||measure(visible[visible.length-1])>width){
  if(measure('…')>width)return[];
  const tail=Array.from(visible[visible.length-1]);
  while(tail.length&&measure(tail.join('')+'…')>width)tail.pop();
  visible[visible.length-1]=tail.join('')+'…';
 }
 return visible;
}
// CORE_END
const $=id=>document.getElementById(id);let model=null,loadId=0;
function setupCanvas(canvas,w,h,zoom=1){const scale=Math.min(zoom*(window.devicePixelRatio||1),8192/w,8192/h,Math.sqrt(16e6/(w*h)));canvas.width=Math.ceil(w*scale);canvas.height=Math.ceil(h*scale);canvas.style.width=w*zoom+'px';canvas.style.height=h*zoom+'px';const c=canvas.getContext('2d');c.setTransform(scale,0,0,scale,0,0);c.imageSmoothingEnabled=true;return c;}
function render(){if(!model)return;const w=+$('wn').value,h=+$('hn').value,zoom=+$('zoom').value,c=setupCanvas($('preview'),w,h,zoom),xs=segments(model.w,model.x,w),ys=segments(model.h,model.y,h);
 for(const y of ys)for(const x of xs){if(!x.length||!y.length||!x.n||!y.n)continue;c.drawImage(model.image,model.offset+x.s,model.offset+y.s,x.length,y.length,x.d,y.d,x.n,y.n);}
 if($('regions').checked){for(const x of xs)if(x.stretch){c.fillStyle='rgba(57,121,255,.22)';c.fillRect(x.d,0,x.n,h);}for(const y of ys)if(y.stretch){c.fillStyle='rgba(32,181,121,.22)';c.fillRect(0,y.d,w,y.n);}}
 const [left,right,top,bottom]=model.padding,cw=Math.max(0,w-left-right),ch=Math.max(0,h-top-bottom);
 if($('padding').checked){c.strokeStyle='#ff8d42';c.lineWidth=1;c.setLineDash([4,3]);c.strokeRect(left+.5,top+.5,Math.max(0,cw-1),Math.max(0,ch-1));c.setLineDash([]);}
 const text=$('text').value;if(text&&cw>0&&ch>0){c.save();c.beginPath();c.rect(left,top,cw,ch);c.clip();c.font='14px -apple-system, sans-serif';c.fillStyle='#ffffff';c.shadowColor='#000';c.shadowBlur=3;c.textAlign='center';c.textBaseline='middle';const lines=layoutText(text,cw,ch,s=>c.measureText(s).width),start=top+(ch-lines.length*18)/2;lines.forEach((line,i)=>c.fillText(line,left+cw/2,start+i*18+9));c.restore();}
 $('size').textContent=w+' × '+h;$('notice').textContent=w<model.fixedW||h<model.fixedH?'当前尺寸小于固定区域总和，固定区域将被压缩。':'固定区域保持像素尺寸，额外宽高按各拉伸段长度分配。';
}
function dimensions(w,h){w=Math.max(1,Math.min(4096,Math.round(w)));h=Math.max(1,Math.min(4096,Math.round(h)));$('wn').value=w;$('hn').value=h;$('width').max=Math.max(1600,w);$('height').max=Math.max(1000,h);$('width').value=w;$('height').value=h;render();}
function original(image,offset,w,h,patch){const c=setupCanvas($('original'),w,h);c.drawImage(image,offset,offset,w,h,0,0,w,h);if(patch){c.fillStyle='#3979ff';for(let i=0;i<patch.x.length;i+=2)c.fillRect(patch.x[i],0,patch.x[i+1]-patch.x[i],2);c.fillStyle='#20b579';for(let i=0;i<patch.y.length;i+=2)c.fillRect(0,patch.y[i],2,patch.y[i+1]-patch.y[i]);}$('originalWrap').hidden=false;}
async function loadFile(file){const id=++loadId;model=null;$('controls').disabled=true;$('preview').hidden=true;$('empty').hidden=false;$('empty').textContent='正在读取…';$('originalWrap').hidden=true;$('status').className='status';$('status').textContent='正在检查';$('filename').textContent=file.name;$('facts').textContent='';$('data').textContent='';$('notice').textContent='';$('size').textContent='';
 try{if(file.size>32*1024*1024)throw Error('请选择小于 32 MB 的 PNG 图片。');const buffer=await file.arrayBuffer(),png=parsePNG(buffer);if(png.width>8192||png.height>8192||png.width*png.height>32e6)throw Error('图片过大，请选择较小的 UI 素材。');
 const image=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img);};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('浏览器无法解码这张图片。'));};img.src=url;});if(id!==loadId)return;
 let patch,offset=0,w=png.width,h=png.height,kind;
 if(png.patch){patch=parsePatch(png.patch,w,h);kind='已编译 · 九宫格数据完整';}
 else if(/\.9\.png$/i.test(file.name)){const temp=document.createElement('canvas');temp.width=w;temp.height=h;const c=temp.getContext('2d',{willReadFrequently:true});c.drawImage(image,0,0);patch=sourcePatch(c.getImageData(0,0,w,h).data,w,h);offset=1;w-=2;h-=2;kind='点九源图 · 已识别 1px 标线';}
 else{original(image,0,w,h,null);$('facts').textContent=w+' × '+h+' px · '+(file.size/1024).toFixed(1)+' KB';$('data').textContent='PNG 数据块：'+png.chunks.join(', ');throw Error('缺少 npTc 九宫格数据。若是未编译源图，请使用 .9.png 文件名。');}
 model={...patch,image,offset,w,h};model.fixedW=w-patch.x.reduce((n,v,i)=>n+(i%2?v:-v),0);model.fixedH=h-patch.y.reduce((n,v,i)=>n+(i%2?v:-v),0);
 $('status').textContent=kind;$('facts').textContent=w+' × '+h+' px · '+(file.size/1024).toFixed(1)+' KB\n横向 '+patch.x.length/2+' 段拉伸 / 纵向 '+patch.y.length/2+' 段拉伸';
 $('data').textContent='PNG 数据块：'+png.chunks.join(', ')+'\n横向边界：'+patch.x.join(', ')+'\n纵向边界：'+patch.y.join(', ')+'\n内容边距（左 / 右 / 上 / 下）：'+patch.padding.join(' / ');
 original(image,offset,w,h,patch);$('controls').disabled=false;$('preview').hidden=false;$('empty').hidden=true;dimensions(Math.max(w,300),Math.max(h,120));
 }catch(error){if(id!==loadId)return;$('status').className='status bad';$('status').textContent=error.message;$('empty').textContent='无法进行九宫格拉伸预览';}
}
$('choose').onclick=()=>$('file').click();$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value='';};
document.addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('over');});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').classList.remove('over');});document.addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
for(const [range,num] of[['width','wn'],['height','hn']]){ $(range).oninput=()=>{$(num).value=$(range).value;render();};$(num).onchange=()=>dimensions(Number($('wn').value)||1,Number($('hn').value)||1);}
for(const id of['regions','padding','text','zoom'])$(id).addEventListener('input',render);
$('background').onchange=()=>$('stage').className='stage '+$('background').value;
$('natural').onclick=()=>model&&dimensions(model.w,model.h);$('wide').onclick=()=>model&&dimensions(Math.max(300,model.w*3),model.h);
</script>
</html>
